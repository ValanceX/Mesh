[package]
authors = [ "Jack Miller <jackmiller0899@gmail.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Tree-sitter grammar for MPRX, the MESH UI language: parsing for mesh-parser, and highlighting queries for editors"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "mprx" ]
license = "MIT"
name = "tree-sitter-mprx"
readme = "README.md"
repository = "https://github.com/ValanceX/Mesh"
version = "0.4.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = "0.27.0"

[build-dependencies]
cc = "1.2"
