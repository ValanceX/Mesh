[workspace]
resolver = "2"
members = [
    "crates/mesh-syntax",
    "crates/mesh-parser",
    "crates/mesh-semantic",
    "crates/mesh-manifest",
    "crates/mesh-analysis",
    "crates/mesh-template",
    "crates/mesh-runtime",
    "crates/mesh-compiler",
    "crates/mesh-lsp",
    "crates/mesh-cli",
    "crates/mesh-wasm",
    "grammar/tree-sitter-mprx",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# `str::floor_char_boundary` (mesh-compiler's renderer) was stabilized in 1.91.
rust-version = "1.91"
license = "MIT"
authors = ["Jack Miller <jackmiller0899@gmail.com>"]
repository = "https://github.com/ValanceX/Mesh"

[workspace.dependencies]
mesh-syntax = { path = "crates/mesh-syntax" }
mesh-parser = { path = "crates/mesh-parser" }
mesh-semantic = { path = "crates/mesh-semantic" }
mesh-manifest = { path = "crates/mesh-manifest" }
mesh-analysis = { path = "crates/mesh-analysis" }
mesh-template = { path = "crates/mesh-template" }
mesh-runtime = { path = "crates/mesh-runtime" }
mesh-compiler = { path = "crates/mesh-compiler" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# The WebAssembly build of `mesh-wasm` (outline v0.4 D1, D2):
# `cargo build -p mesh-wasm --target wasm32-unknown-unknown --profile wasm`.
# `panic = "abort"` belongs here only: `wasm32-unknown-unknown` can't
# unwind anyway, while `mesh-lsp` relies on unwinding in `dev` and
# `release` (it catches a panicking request handler).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Symbol names are two thirds of the module; a trap's stack trace loses
# them, and the shipped module doesn't need them.
strip = true
