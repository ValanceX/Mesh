[package]
name = "mesh-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The MESH language server for MPRX: a client of mesh-compiler, with no semantics of its own."

[lints]
workspace = true

[[bin]]
name = "mesh-lsp"
