[package]
name = "mesh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native CLI for the MESH toolchain (`mesh check` for MPRX files)."

[lints]
workspace = true

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
mesh-syntax.workspace = true
mesh-compiler.workspace = true
mesh-manifest.workspace = true
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
mesh-semantic.workspace = true
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
