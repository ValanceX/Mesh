[package]
name = "mesh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native CLI for the MESH toolchain (parse, check, compile MPRX)."

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
mesh-syntax.workspace = true
mesh-compiler.workspace = true
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
