[package]
name = "mesh-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compiler entry point for MPRX: source to Semantic IR, with aggregated diagnostics, rendered rustc-style or as JSON."

[lints]
workspace = true

[dependencies]
mesh-syntax.workspace = true
mesh-semantic.workspace = true
mesh-parser.workspace = true
mesh-manifest.workspace = true
mesh-analysis.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.57", default-features = false }
