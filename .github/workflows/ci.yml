name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be run on every OS without a pull request.
  workflow_dispatch:
  # The release workflow runs all of CI on the tagged commit first.
  workflow_call:

# The `@v7` actions run on the runner's Node 24 runtime, not the deprecated
# Node 20 one. That is separate from `node-version: 22` below, which only
# installs the Node used by the grammar's own npm tests.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # With no arguments, rustup installs the toolchain (and components)
      # pinned in rust-toolchain.toml, so CI lints with exactly the
      # compiler used locally.
      - name: Install Rust
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Broken intra-doc links and malformed doc comments fail the build,
      # as warnings do everywhere else.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The normative number-to-text table (spec §9.7.7.1) must be exactly
      # what its reference generator computes from the rule. Standard
      # library Python only; the runner has python3.
      - name: Number-to-text table is what the rule gives
        run: python3 docs/tables/number_to_text.py --check
      # Installs Node 22 for the grammar tests; the action itself runs on
      # the runner's Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Grammar tests
        working-directory: grammar/tree-sitter-mprx
        run: |
          # Skip the Node binding build; only the tree-sitter CLI binary is needed.
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npm test
      # The generated parser is committed; it must be exactly what
      # grammar.js generates, with the pinned tree-sitter CLI.
      - name: Generated parser is up to date
        working-directory: grammar/tree-sitter-mprx
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/

  # The whole workspace suite, natively, once per OS (outline v0.4 D9):
  # one runner each, on whatever architecture it has. Shipped binaries are
  # built and exercised per architecture elsewhere.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      # Every failing test binary, not just the first: one run on a new
      # platform reports everything it found.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The npm workspace builds and typechecks. `packages/package-lock.json`
  # is npm 11's (docs/README.md): with the platform packages published,
  # npm 10 resolves them from the registry instead of the workspace's
  # `file:` overrides and rejects the lockfile, so every `npm ci` of the
  # workspace here runs npm 11.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build, typecheck, and test the launcher
        working-directory: packages
        run: |
          npx --yes npm@11 ci
          npm run build
          npm run typecheck
          npm test -w @valancex/mesh-lsp

  # The compiler and the runtime in WebAssembly, and
  # @valancex/mesh-compiler and @valancex/mesh-runtime around them, on each
  # Node LTS release the packages support: agreement with a native `mesh`
  # built here, parity with the native runtime (through its harness, and
  # replaying every call the native property test makes), the V8
  # number-to-text comparison, determinism, positions, failure, memory,
  # version, nesting, size, packing, the slice, and headless Chromium.
  wasm:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Build the native mesh and runtime harness to compare with
        # Two builds: `--example` would limit one build to the example,
        # leaving out the `mesh` binary.
        run: |
          cargo build --locked -p mesh-cli
          cargo build --locked -p mesh-runtime-wasm --example harness
      # Writes every call it makes to target/mesh-runtime-property/, for
      # the runtime package's parity test.
      - name: The native property test's requests
        run: cargo test --locked -p mesh-runtime --test property
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        working-directory: packages
        run: |
          npx --yes npm@11 ci
          npm run build:wasm -w @valancex/mesh-compiler
          npm run build:wasm -w @valancex/mesh-runtime
          npm run build
          npm run typecheck
      - name: Install Chromium
        working-directory: packages
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: packages
        run: |
          npm test -w @valancex/mesh-compiler
          npm test -w @valancex/mesh-runtime

  # Every shipped mesh-lsp binary, built and exercised on a runner of its
  # own OS and architecture (outline v0.4 D8, D9): the transport tests run
  # against the binary, then through the launcher installed from
  # tarballs, then npm's install scenarios run. Nothing here is
  # cross-compiled, and only these tests run per architecture.
  native-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-musl, exe: "" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl, exe: "" }
          - { target: darwin-x64, runner: macos-15-intel, triple: x86_64-apple-darwin, exe: "" }
          - { target: darwin-arm64, runner: macos-15, triple: aarch64-apple-darwin, exe: "" }
          - { target: win32-x64, runner: windows-2025, triple: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # macOS binaries run on macOS 11 and later.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # The Windows binary needs no Visual C++ runtime installed.
      RUSTFLAGS: ${{ startsWith(matrix.target, 'win32') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      # Linux binaries are static musl builds, so they run on any
      # distribution; musl-gcc compiles Tree-sitter's C for them.
      - name: Install musl
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.triple }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.triple }}
      - name: Build mesh-lsp
        run: cargo build --release --locked -p mesh-lsp --target ${{ matrix.triple }}
      - name: Transport tests, against the binary
        run: cargo test --release --locked --target ${{ matrix.triple }} -p mesh-lsp --test transport
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the packages from tarballs
        working-directory: packages
        run: |
          npx --yes npm@11 ci
          npm run build -w @valancex/mesh-lsp
          node mesh-lsp/scripts/install-local.mjs "../target/${{ matrix.triple }}/release/mesh-lsp${{ matrix.exe }}" "$RUNNER_TEMP/mesh-lsp" | tail -n 1 > "$RUNNER_TEMP/installed.json"
          echo "MESH_LSP_LAUNCHER=$(node -p "require(process.argv[1]).launcher" "$RUNNER_TEMP/installed.json")" >> "$GITHUB_ENV"
      - name: Transport tests, through the installed launcher
        run: cargo test --release --locked --target ${{ matrix.triple }} -p mesh-lsp --test transport
      - name: npm's install scenarios
        working-directory: packages/mesh-lsp
        run: node test/install.mjs "../../target/${{ matrix.triple }}/release/mesh-lsp${{ matrix.exe }}"

  # Checks the declared `rust-version`: the workspace, with its committed
  # Cargo.lock, still compiles on 1.91. (This shows 1.91 works; it doesn't
  # show that nothing older would.)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Check on the MSRV
        run: cargo +1.91.0 check --locked --workspace --all-targets
      - name: Build for WebAssembly on the MSRV
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.91.0
          cargo +1.91.0 build --locked -p mesh-wasm -p mesh-runtime-wasm --target wasm32-unknown-unknown
